name: Backtest

# Hand-triggered only: a DFM replay refits the factor once per month of history,
# so this is minutes-to-an-hour of compute and a fair amount of ALFRED traffic.
# Nothing else in the repo runs it, and RESULTS.md changes only when it does.
on:
  workflow_dispatch:
    inputs:
      factor:
        description: "Factor estimator for the replay (dfm is what the site ships)"
        type: choice
        options: [dfm, pca]
        default: dfm
      start:
        description: "Replay start date"
        default: "1995-01-01"

permissions:
  contents: write
  issues: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # a DFM replay is ~2s per month of history, plus vintages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Replay history and regenerate RESULTS.md
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python scripts/backtest.py \
            --factor "${{ inputs.factor }}" \
            --start "${{ inputs.start }}"

      - name: Commit RESULTS.md if it changed
        run: |
          git config user.name "nowcast-bot"
          git config user.email "bot@users.noreply.github.com"
          git add RESULTS.md
          if git diff --cached --quiet; then
            echo "backtest produced no change to RESULTS.md"
          else
            git commit -m "chore: backtest rerun (${{ inputs.factor }}) $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Backtest run failed (run ${context.runId})`,
              body: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
